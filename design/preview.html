/* ---------------- Утилиты ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const fmt = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\*([^*]+)\*/g, "<i>$1</i>");
function md(text) {
  return text.split(/\n\n+/).map(block => {
    const out = []; let list = null, para = [];
    const fp = () => { if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } };
    const fl = () => { if (list) { out.push(`<${list.tag}>${list.items.map(i => "<li>" + inline(i) + "</li>").join("")}</${list.tag}>`); list = null; } };
    for (const l of block.split("\n")) {
      const o = l.match(/^\d+\.\s+(.*)/), u = l.match(/^-\s+(.*)/);
      if (o || u) { fp(); const tag = o ? "ol" : "ul"; if (!list || list.tag !== tag) { fl(); list = { tag, items: [] }; } list.items.push((o || u)[1]); }
      else { fl(); para.push(l); }
    }
    fp(); fl(); return out.join("");
  }).join("");
}
const tc = t => `<a class="tc tap" href="${YT}&t=${t}s" target="_blank" title="Открыть на YouTube с ${fmt(t)}" onclick="event.stopPropagation()">${I.play}${fmt(t)}</a>`;
let store = {}; try { store = JSON.parse(localStorage.getItem("preview-marks") || "{}"); } catch (e) {}
const save = () => { try { localStorage.setItem("preview-marks", JSON.stringify(store)); } catch (e) {} };
const stepOn = (g, i) => { const k = g.id + ":" + i; return k in store ? store[k] : !!g.done; };

/* ---------------- Кадры раздела: от начала до конца, максимум 6 ---------------- */
function framesFor(s, max = 6) {
  const l = FRAMES.filter(f => f[0] >= s.t && f[0] < s.end);
  if (l.length <= max) return l;
  return Array.from({ length: max }, (_, i) => l[Math.round(i * (l.length - 1) / (max - 1))]);
}
function frameGrid(s) {
  if (s.skip) return "";
  const l = framesFor(s); if (!l.length) return "";
  return `<div class="frames">${l.map(([t, f]) => `
    <a class="frame" href="${YT}&t=${t}s" target="_blank">
      <div class="img"><img loading="lazy" src="${BASE + f}" alt=""><div class="play"><span>${I.play}</span></div></div>
      <figcaption>${fmt(t)}</figcaption></a>`).join("")}</div>`;
}

/* ---------------- Шкала времени ---------------- */
function buildTimeline() {
  const bar = $("#tlBar"), tip = $("#tip"), total = D.sections[D.sections.length - 1].end;
  bar.innerHTML = D.sections.map(s => {
    const f = framesFor(s, 1)[0];
    return `<button class="tl-seg ${s.skip ? "skip" : ""}" data-id="${s.id}" style="flex:${s.end - s.t};${f && !s.skip ? `background-image:url('${BASE + f[2]}')` : ""}" aria-label="${esc(s.title)}"></button>`;
  }).join("");
  const step = total > 3600 ? 600 : total > 900 ? 120 : 60, marks = [];
  for (let t = 0; t < total; t += step) marks.push(t);
  $("#tlScale").innerHTML = marks.map(t => `<span style="left:${t / total * 100}%">${fmt(t)}</span>`).join("") + `<span style="left:100%">${fmt(total)}</span>`;
  $$(".tl-seg", bar).forEach(el => {
    const s = D.sections.find(x => x.id === el.dataset.id);
    el.onmouseenter = () => {
      const fr = s.skip ? [] : framesFor(s);
      tip.innerHTML = `<div class="tt"><b>${fmt(s.t)} · ${esc(s.title)}</b><span class="h">${esc(s.hint)}${s.skip ? " (пропущено)" : ""}</span></div>` +
        (fr.length ? `<div class="grid">${fr.map(f => `<img src="${BASE + f[2]}" alt="">`).join("")}</div>` : "");
      const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight, gap = 10;
      const below = r.bottom + gap + h <= innerHeight - 8;           // влезает вниз — вниз, иначе вверх
      const x = Math.min(Math.max(r.left + r.width / 2 - w / 2, 8), innerWidth - w - 8);
      const y = below ? r.bottom + gap : Math.max(8, r.top - gap - h);
      tip.style.left = x + "px"; tip.style.top = y + "px";
      tip.style.setProperty("--ox", (r.left + r.width / 2 - x) + "px"); tip.style.setProperty("--oy", below ? "0%" : "100%");
      tip.classList.add("show");
    };
    el.onmouseleave = () => tip.classList.remove("show");
    el.onclick = () => { tip.classList.remove("show"); goto(s.id); };
  });
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    curSec = e.target.id.slice(4);
    $$(".tl-seg").forEach(x => x.classList.toggle("on", x.dataset.id === curSec));
    $$("#rail .toc a").forEach(x => x.classList.toggle("on", x.dataset.id === curSec));
  }), { rootMargin: "-150px 0px -60% 0px" });
  D.sections.forEach(s => io.observe($("#sec-" + s.id)));
  addEventListener("scroll", () => tip.classList.remove("show"), { passive: true });
}

function openMenu(anchor, items, opts = {}) {
  closeMenu(true);

    if (it === "-") return "<hr>";
    if (it.header) return `<div class="mh">${esc(it.header)}</div>`;
    return `<button class="mi ${it.danger ? "danger" : ""}" style="--d:${i}" data-i="${i}">

  }).join("");
  $$(".mi", menu).forEach(b => b.onclick = e => { e.stopPropagation(); const it = items[+b.dataset.i]; closeMenu(); it.do && it.do(); });
  menu.style.visibility = "hidden"; menu.classList.add("show");
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  menu.classList.remove("show"); menu.style.visibility = "";
  let x, y, ox = "left", oy = "top";
  if (opts.point) { x = opts.point.x; y = opts.point.y; }
  else { const r = anchor.getBoundingClientRect(); x = opts.alignRight ? r.right - mw : r.left; y = r.bottom + 6; }
  if (x + mw > innerWidth - 8) { x = Math.max(8, x - (opts.point ? mw : 0)); if (x + mw > innerWidth - 8) x = innerWidth - mw - 8; ox = "right"; }
  if (y + mh > innerHeight - 8) { const r = anchor && anchor.getBoundingClientRect(); y = opts.point ? y - mh : r.top - mh - 6; oy = "bottom"; }
  if (opts.alignRight) ox = "right";
  menu.style.left = x + "px"; menu.style.top = y + "px"; menu.style.transformOrigin = oy + " " + ox;
  menuOwner = anchor; anchor && anchor.classList.add("open");
  requestAnimationFrame(() => menu.classList.add("show"));
}

$("#moreBtn").onclick = e => { e.stopPropagation(); openMenu(e.currentTarget, [
  { icon: I.yt, label: "Смотреть на YouTube", do: () => open(YT) },
  { icon: I.link, label: "Копировать ссылку", do: () => { navigator.clipboard?.writeText(YT); toast("✓ Ссылка скопирована"); } },
  { icon: I.print, label: "Распечатать конспект", do: () => print() }
], { alignRight: true }); };
$("#settingsBtn").onclick = e => { e.stopPropagation(); openMenu(e.currentTarget, [
  { header: "Тема" },
  ...[["system", "Как в системе"], ["light", "Светлая"], ["dark", "Тёмная"]].map(([k, v]) => ({ tick: theme === k, label: v, do: () => setTheme(k) })),
  "-",
  { header: "Язык" },
  ...[["uk", "Українська"], ["ru", "Русский"], ["en", "English"]].map(([k, v]) => ({ tick: lang === k, label: v, do: () => { setLang(k); toast("Язык интерфейса переключится в приложении"); } }))
]); };

/* ---------------- Отметки, копирование ---------------- */
let toastTimer;
function toast(html) { const t = $("#toast"); t.innerHTML = html; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1700); }
document.addEventListener("click", e => {
  const c = e.target.closest(".copy");
  if (c) { navigator.clipboard?.writeText(decodeURIComponent(c.dataset.copy)); c.innerHTML = I.ok; c.classList.add("ok"); toast("✓ Скопировано");
    setTimeout(() => { c.innerHTML = I.copy; c.classList.remove("ok"); }, 1400); return; }
  const ch = e.target.closest(".check");
  if (ch) { const step = ch.closest(".step"); const on = !ch.classList.contains("on");
    ch.classList.toggle("on", on); step.classList.toggle("done", on); store[step.dataset.key] = on; save(); updateProgress(); return; }
  const g = e.target.closest("[data-goto]"); if (g) goto(g.dataset.goto);
});

/* ---------------- «Пилюля» ---------------- */
const isl = () => $("#island");
const QUEUE = [["Claude Code ПОЛНЫЙ ГАЙД 2026", "processing"], ["Обзор на лучшую нейросеть…", "queued"]];
const ST = { queued: "в очереди", processing: "обрабатывается", done: "готово" };
function renderQueue() {
  $("#queue").innerHTML = QUEUE.length ? QUEUE.map(([n, s]) => `<div class="isl-row"><span class="sync ${s === "processing" ? "busy" : s === "done" ? "ok" : "off"}"></span><span class="nm">${esc(n)}</span><span class="st">${ST[s]}</span></div>`).join("") : '<div class="isl-row"><span class="st" style="margin:0">Очередь пуста</span></div>';
}
function setIsland(mode) { const i = isl(); i.classList.toggle("add", mode === "add"); i.classList.toggle("full", mode === "full"); if (mode === "add" || mode === "full") setTimeout(() => $("#islandInput").focus(), 220); if (mode === "none") $("#islandInput").value = ""; }
function openIsland(e) { if (e) e.stopPropagation(); if (!isl().classList.contains("full")) setIsland("add"); }
function closeIsland() { setIsland("none"); }
$("#islAdd").onclick = openIsland;
$("#islExp").onclick = e => { e.stopPropagation(); setIsland(isl().classList.contains("full") ? "none" : "full"); };
$("#islGo").onclick = addVideo;
$("#islandInput").onkeydown = e => { if (e.key === "Enter") addVideo(); if (e.key === "Escape") closeIsland(); };
function addVideo(e) { if (e) e.stopPropagation(); const v = $("#islandInput").value.trim();
  if (!/youtu/.test(v)) { toast("Нужна ссылка на YouTube"); isl().animate([{ transform: "translateX(0)" }, { transform: "translateX(-6px)" }, { transform: "translateX(6px)" }, { transform: "translateX(0)" }], { duration: 260 }); return; }
  QUEUE.push([v, "queued"]); renderQueue(); $("#islandInput").value = ""; syncFlash();
  setIsland(isl().classList.contains("full") ? "full" : "none"); toast("✓ Видео в очереди — обработаю дома"); }
// Точка синхронизации: идёт / всё сохранено / нет сети
function setSync(s) { const d = $("#sync"); d.className = "sync " + s; d.title = { ok: "Всё сохранено", busy: "Синхронизация…", off: "Нет сети — отправлю позже" }[s]; }
function syncFlash() { setSync("busy"); setTimeout(() => setSync(navigator.onLine ? "ok" : "off"), 1600); }
addEventListener("online", () => setSync("ok")); addEventListener("offline", () => setSync("off"));
// Поиск по всем конспектам (в макете — по этому видео)
$("#islSearch").oninput = e => {
  const q = e.target.value.trim().toLowerCase(); const out = [];
  if (q) {
    D.sections.forEach(s => (s.title + " " + s.body).toLowerCase().includes(q) && out.push(["Конспект", s.title, () => goto(s.id)]));
    D.terms.forEach(([n, d]) => (n + " " + d).toLowerCase().includes(q) && out.push(["Термин", n, () => { setTab("terms"); }]));
    D.guides.forEach(g => (g.title + JSON.stringify(g.steps)).toLowerCase().includes(q) && out.push(["Инструкция", g.title, () => setTab("guides")]));
  }
  $("#searchRes").innerHTML = out.length ? out.slice(0, 8).map((o, i) => `<button class="isl-row tap" data-r="${i}"><span class="nm">${esc(o[1])}</span><span class="st">${o[0]}</span></button>`).join("") : (q ? '<div class="isl-row"><span class="st" style="margin:0">Ничего не найдено</span></div>' : "");
  $$("#searchRes [data-r]").forEach(b => b.onclick = () => { setIsland("none"); out[+b.dataset.r][2](); });
};
document.addEventListener("click", e => { if (!e.target.closest(".island") && !e.target.closest(".row.add") && !e.target.closest(".menu")) closeIsland(); });

function toggleSide(open) { $("#shell").classList.toggle("side-open", open); }
document.addEventListener("click", e => { const r = e.target.closest("[data-video]"); if (r && !e.target.closest(".more")) toggleSide(false); });

/* ---------------- Старт ---------------- */
const h = new Date().getHours();
$("#hello").textContent = (h < 5 ? "Доброй ночи" : h < 12 ? "Доброе утро" : h < 18 ? "Добрый день" : "Добрый вечер") + " 👋";
render(); buildTimeline(); renderQueue(); setSync("busy"); setTimeout(() => setSync(navigator.onLine ? "ok" : "off"), 1500);
try { theme = localStorage.getItem("preview-theme") || "system"; } catch (e) {}
setTab("main"); setTheme(theme); setLang(lang);
addEventListener("resize", () => moveThumb($("#tabs")));
</script>
</body>
</html>
